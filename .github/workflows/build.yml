name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          # msvc-dev-cmd resets PATH, so the POST_BUILD windeployqt hook in
          # DeployWindows.cmake may not have found the tool. Run it here
          # explicitly against the final exe so Qt core QML modules
          # (QtQuick, QtQuick.Controls, …) land in build/qml/.
          $qtBin = Split-Path (Get-Command qmake).Source
          Write-Host "Qt bin: $qtBin"
          & "$qtBin\windeployqt.exe" `
            --release `
            --no-compiler-runtime `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --no-translations `
            --no-system-dxc-compiler `
            --qmldir qml `
            build\Ua.exe

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          Compress-Archive -Path dist\* -DestinationPath Ua-windows-x64.zip -CompressionLevel Optimal
          Write-Host "Final size: $('{0:N1}' -f ((Get-Item Ua-windows-x64.zip).Length / 1MB)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Ua-windows-x64
          path: Ua-windows-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
