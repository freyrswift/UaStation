name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.name == 'windows-x64' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2022_64
            cmake-args: -DCMAKE_CXX_COMPILER=cl
            artifact: Ua-windows-x64.zip
          - name: macos-arm64
            runner: macos-15
            qt-host: mac
            qt-arch: clang_64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            artifact: Ua-macos-arm64.dmg
          - name: macos-x64
            runner: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            artifact: Ua-macos-x64.dmg
          - name: linux-x64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            cmake-args: -DCMAKE_INSTALL_LIBDIR=lib
            artifact: Ua-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf fonts-noto-cjk \
            libgl1-mesa-dev libegl1-mesa-dev libopengl0 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          modules: qt5compat
          cache: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          ${{ matrix.cmake-args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Deploy Qt runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # msvc-dev-cmd resets PATH, so the POST_BUILD windeployqt hook in
          # DeployWindows.cmake may not have found the tool. Run it here
          # explicitly against the final exe so Qt core QML modules
          # (QtQuick, QtQuick.Controls, …) land in build/qml/.
          $qtBin = Split-Path (Get-Command qmake).Source
          Write-Host "Qt bin: $qtBin"
          & "$qtBin\windeployqt.exe" `
            --release `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --no-translations `
            --no-system-dxc-compiler `
            --qmldir qml `
            build\ua.exe

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure -j 1

      - name: Install
        shell: bash
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/dist"

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plutil -lint dist/ua.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' dist/ua.app/Contents/Info.plist)" = ua
          test -x dist/ua.app/Contents/MacOS/ua
          test -x dist/ua.app/Contents/MacOS/ua-skills-mcp
          lipo dist/ua.app/Contents/MacOS/ua -verify_arch ${{ matrix.name == 'macos-arm64' && 'arm64' || 'x86_64' }}
          otool -L dist/ua.app/Contents/MacOS/ua
          dist/ua.app/Contents/MacOS/ua-skills-mcp --version

      - name: Verify Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x dist/bin/ua
          test -x dist/bin/ua-skills-mcp
          test -f dist/bin/qt.conf
          test -d dist/qml
          test -d dist/plugins/platforms
          env -u LD_LIBRARY_PATH ldd dist/bin/ua | tee build/linux-dependencies.log
          if grep -q 'not found' build/linux-dependencies.log; then exit 1; fi
          env -u LD_LIBRARY_PATH dist/bin/ua-skills-mcp --version

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path dist\ua-skills-mcp.exe)) { throw 'Skills MCP executable missing from package' }
          & .\dist\ua-skills-mcp.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged skills MCP runtime failed' }
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          Compress-Archive -Path dist\* -DestinationPath packages\Ua-windows-x64.zip -CompressionLevel Optimal

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -B packages

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cpack --config build/CPackConfig.cmake -G TGZ -B packages

      - uses: actions/upload-artifact@v4
        with:
          name: Ua-${{ matrix.name }}
          path: packages/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/linux-dependencies.log
            packages/_CPack_Packages/**/hdiutil*.log
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(awk '/^[[:space:]]*VERSION [0-9]+\.[0-9]+\.[0-9]+/ { print $2; exit }' CMakeLists.txt)"
          test "$version" = "$project_version"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Retain corresponding Qt source
        shell: bash
        working-directory: artifacts
        run: |
          source=qt-everywhere-src-6.8.3.tar.xz
          curl --fail --location --retry 3 --output "$source" \
            "https://download.qt.io/archive/qt/6.8/6.8.3/single/$source"
          printf '%s  %s\n' \
            cdd3a69967208276bb01af7ace7dba0ba53e679f886a4cbe624225c60fb73f2c \
            "$source" | sha256sum --check -

      - name: Generate release checksums
        shell: bash
        working-directory: artifacts
        run: |
          files=(Ua-windows-x64.zip Ua-macos-arm64.dmg Ua-macos-x64.dmg Ua-linux-x64.tar.gz qt-everywhere-src-6.8.3.tar.xz)
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          name: Ua Toolbox ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
